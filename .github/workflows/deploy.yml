name: FTP Deploy on Release

on:
  release:
    types: [published] # Sadece bir release yayınlandığında çalışır

jobs:
  deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
    
    - name: 📂 Sync files to FTP
      uses: genietim/ftp-action@releases/v4
      with:
        host: ${{ secrets.FTP_SERVER }}
        user: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./site/ # Sadece bu klasörün içeriğini gönderir
        remoteDir: "domains/capsule.net.tr/public_html"
